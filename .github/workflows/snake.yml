name: Generate Winter Contribution Snake

on:
  schedule:
    - cron: "23 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate Winter Snake
        uses: Platane/snk@v3
        with:
          github_user_name: lethinkj
          outputs: |
            dist/github-snake.svg?color_snake=%2300D9FF&color_dots=%230B1926,%231A4055,%232D718C,%237ACDE8,%23E5FAFF
            dist/github-snake-dark.svg?color_snake=%23E5FAFF&color_dots=%230B1926,%231A4055,%232D718C,%237ACDE8,%23E5FAFF

      - name: Publish Winter Snake
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
