
name: 🎃 Haunted GitHub Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 🦇 Summon GitHub Metrics
        uses: lowlighter/metrics@latest
        with:
          # Personal token for reading account data
          token: ${{ secrets.GH_PAT }}

          # GitHub identity
          user: lethinkj

          # Generated dashboard
          filename: github-metrics.svg
          output_action: commit

          # Visual configuration
          config_timezone: Asia/Kolkata
          config_display: large
          config_animations: yes
          config_base64: yes

          # Main profile information
          base: header

          # Programming language statistics
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_details: percentage, bytes-size
          plugin_languages_colors: github

          # Contribution calendar
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

          # Achievements
          plugin_achievements: yes
          plugin_achievements_display: compact

          # Recent GitHub activity
          plugin_activity: yes
          plugin_activity_limit: 5
          plugin_activity_days: 14

          # Dashboard layout
          config_order: base.header, isocalendar, languages, achievements, activity
