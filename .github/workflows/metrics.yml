name: Generate GitHub Metrics

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Generate GitHub Metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GH_PAT }}
          user: lethinkj
          filename: github-metrics.svg

          # Main profile sections
          base: header, community, repositories, metadata

          # Display settings
          config_timezone: Asia/Kolkata
          config_display: large
          config_order: base.header, isocalendar, languages, achievements, activity, base.community, base.repositories, base.metadata

          # Contribution calendar
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

          # Most used programming languages
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_details: percentage, bytes-size

          # Achievements
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: C
          plugin_achievements_limit: 8

          # Recent GitHub activity
          plugin_activity: yes
          plugin_activity_limit: 5
          plugin_activity_days: 0
          plugin_activity_filter: issue, pr, release, fork, review, ref/create

          # Show plugin errors in workflow logs
          plugins_errors_fatal: yes
